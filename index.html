<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>clrtxt — Thomas Alley</title>
  <meta name="description" content="Thomas Alley — get in touch at thomas@clrtxt.com" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #F8F6F3;
      --fg:        #2E2C29;
      --muted:     #78746F;
      --rule:      #DFDAD3;
      --accent:    #C4622D;
      --accent-hi: #A5511F;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:        #171614;
        --fg:        #E9E4DC;
        --muted:     #918B83;
        --rule:      #322F2B;
        --accent:    #E58A4E;
        --accent-hi: #F0A472;
      }
    }

    body {
      /* No webfont: the system mono stack is the typeface. */
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      background: var(--bg);
      color: var(--fg);
      font-size: 15px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 4rem 2rem;
    }

    /* ── WORDMARK ── */
    .wordmark {
      font-size: clamp(2.75rem, 9vw, 4.25rem);
      font-weight: 700;
      letter-spacing: -0.045em;
      line-height: 1;
      margin-bottom: 2.5rem;
    }

    .wordmark span { color: var(--accent); }

    .cursor {
      display: inline-block;
      width: 0.5em;
      height: 0.85em;
      margin-left: 0.12em;
      vertical-align: -0.02em;
      background: var(--accent);
      animation: blink 1.15s step-end infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; opacity: 0.55; }
    }

    /* ── IDENTITY ── */
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 0.35rem;
    }

    .tagline {
      color: var(--muted);
      margin-bottom: 2.75rem;
      max-width: 46ch;
      text-wrap: pretty;
    }

    /* ── KEY/VALUE BLOCK ── */
    /* The whole conceit: contact details set like the header of a plain
       text file, label column aligned by the monospace grid. */
    dl {
      display: grid;
      grid-template-columns: 8.5ch 1fr;
      gap: 0.4rem 1.5rem;
      border-top: 1px solid var(--rule);
      padding-top: 1.5rem;
    }

    dt {
      color: var(--muted);
      font-size: 0.875rem;
      padding-top: 0.08rem;
    }

    dd a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }

    dd a:hover,
    dd a:focus-visible {
      color: var(--accent-hi);
      border-color: currentColor;
    }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--rule);
      padding: 1.25rem 2rem;
    }

    .footer-inner {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      font-size: 0.8125rem;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      main { padding: 3rem 1.25rem; }
      footer { padding: 1.25rem; }
      dl { grid-template-columns: 7.5ch 1fr; gap: 0.4rem 1rem; }
      .footer-inner { flex-direction: column; gap: 0.35rem; text-align: center; }
    }
  </style>
</head>
<body>

  <main>
    <div class="wordmark">clr<span>txt</span><i class="cursor" aria-hidden="true"></i></div>

    <h1>Thomas Alley</h1>
    <dl>
      <dt>email</dt>
      <dd><a href="mailto:thomas@clrtxt.com">thomas@clrtxt.com</a></dd>
    </dl>
  </main>

  <footer>
    <div class="footer-inner">
      <span>© 2026 clrtxt</span>
      <span>cleartext, as advertised</span>
    </div>
  </footer>

</body>
</html>
