<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>clrtxt — Thomas Alley</title>
  <meta name="description" content="Thomas Alley — get in touch at thomas@clrtxt.com" />
  <link rel="canonical" href="https://clrtxt.com/" />
  <meta name="theme-color" content="#F8F6F3" />

  <!-- Icons -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/favicon.svg" />

  <!-- Open Graph / unfurl -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://clrtxt.com/" />
  <meta property="og:title" content="clrtxt — Thomas Alley" />
  <meta property="og:description" content="Thomas Alley — get in touch at thomas@clrtxt.com" />
  <meta property="og:image" content="https://clrtxt.com/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="clrtxt — Thomas Alley — thomas@clrtxt.com" />

  <!-- Twitter/X card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="clrtxt — Thomas Alley" />
  <meta name="twitter:description" content="Thomas Alley — get in touch at thomas@clrtxt.com" />
  <meta name="twitter:image" content="https://clrtxt.com/og.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --orange:       #C4622D;
      --orange-dark:  #A5511F;
      --orange-faint: #F5EAE2;
      --grey-900:     #3A3835;
      --grey-600:     #6B6866;
      --grey-300:     #D6D3CE;
      --bg:           #F8F6F3;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--grey-900);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* ── HERO ── */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 4rem 2.5rem;
    }

    .hero-wordmark {
      font-size: clamp(3.5rem, 10vw, 7rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: lowercase;
      line-height: 1;
      margin-bottom: 3rem;
    }

    .hero-wordmark span {
      color: var(--orange);
    }

    .hero h1 {
      font-size: clamp(2.2rem, 5vw, 3.75rem);
      font-weight: 300;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin-bottom: 2rem;
    }

    .contact-email {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--orange);
      text-decoration: none;
      border-bottom: 1px solid var(--orange-faint);
      padding-bottom: 2px;
      transition: color 0.15s, border-color 0.15s;
    }

    .contact-email:hover {
      color: var(--orange-dark);
      border-color: var(--orange-dark);
    }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--grey-300);
      padding: 1.5rem 2.5rem;
    }

    .footer-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    footer p,
    footer a {
      font-size: 0.82rem;
      color: var(--grey-600);
    }

    footer a {
      text-decoration: none;
    }

    footer a:hover {
      color: var(--orange);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      .hero {
        padding: 3rem 1.25rem;
      }

      footer {
        padding: 1.25rem;
      }

      .footer-inner {
        flex-direction: column;
        gap: 0.5rem;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <!-- HERO -->
  <main class="hero">
    <div class="hero-wordmark">clr<span>txt</span></div>
    <h1>Thomas Alley</h1>
    <a class="contact-email" href="mailto:thomas@clrtxt.com">
      thomas@clrtxt.com
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="footer-inner">
      <p>© 2026 clrtxt</p>
      <a href="mailto:thomas@clrtxt.com">thomas@clrtxt.com</a>
    </div>
  </footer>

</body>
</html>
